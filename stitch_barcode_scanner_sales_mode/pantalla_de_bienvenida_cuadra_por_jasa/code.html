<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bienvenida CUADRA</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e44ea1",
                        "secondary": "#42fae0",
                        "background-light": "#f8f6f7",
                        "background-dark": "#21121a",
                        "on-primary": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom gradient for the specific vibrance requested */
        .cuadra-gradient {
            background: linear-gradient(135deg, #e44ea1 0%, #d43d91 40%, #42fae0 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased selection:bg-primary selection:text-white overflow-hidden">
<!-- Main Container: Full viewport height, flex column -->
<main class="relative w-full h-screen min-h-[600px] flex flex-col justify-between overflow-hidden cuadra-gradient text-white">
<!-- Decorative subtle pattern overlay -->
<div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] mix-blend-overlay pointer-events-none"></div>
<!-- Abstract floating shapes for modern vibe -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-secondary rounded-full blur-[80px] opacity-20 animate-pulse"></div>
<div class="absolute top-1/3 -left-20 w-48 h-48 bg-white rounded-full blur-[60px] opacity-10"></div>
<!-- Top Section: Logo & Branding (Centered vertically in the upper growing space) -->
<div class="flex-grow flex flex-col items-center justify-center px-6 relative z-10 pt-10">
<!-- Logo Container -->
<div class="flex flex-col items-center gap-6">
<!-- Icon Mark -->
<div class="w-24 h-24 sm:w-32 sm:h-32 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center shadow-lg border border-white/30 transform rotate-3">
<span class="material-symbols-outlined text-white !text-6xl sm:!text-7xl">
                        grid_view
                    </span>
</div>
<!-- Text Logo -->
<h1 class="text-5xl sm:text-6xl font-extrabold tracking-tight text-center drop-shadow-sm">
                    CUADRA
                </h1>
<!-- Tagline / Attribution -->
<div class="flex items-center gap-2 mt-2 bg-white/10 backdrop-blur-sm px-4 py-2 rounded-full border border-white/20">
<span class="material-symbols-outlined !text-[18px]">verified</span>
<p class="text-sm font-medium tracking-wide">
                        Powered by <span class="font-bold">JASA</span>
</p>
</div>
</div>
<!-- Value Prop (Optional subtle text) -->
<p class="text-white/80 text-center mt-12 max-w-xs text-lg font-light leading-relaxed">
                Gestión inteligente para tu negocio, simplificada al máximo.
            </p>
</div>
<!-- Bottom Section: Actions & Safe Area -->
<div class="w-full px-6 pb-12 pt-6 relative z-10 flex flex-col gap-4">
<!-- Primary Action Button -->
<button class="w-full bg-white text-primary hover:bg-white/95 active:scale-[0.98] transition-all duration-200 h-14 rounded-full font-bold text-lg shadow-xl flex items-center justify-center gap-2 group">
<span>Comenzar</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Secondary/Login Link -->
<button class="w-full h-12 flex items-center justify-center text-white/90 hover:text-white font-medium text-sm transition-colors">
                ¿Ya tienes una cuenta? <span class="underline ml-1">Inicia sesión</span>
</button>
<!-- iOS Home Indicator Spacing -->
<div class="h-2"></div>
</div>
</main>
</body></html>
