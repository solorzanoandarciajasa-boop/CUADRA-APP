<!DOCTYPE html>
<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Detalles de Nuevo Producto</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white min-h-screen flex flex-col overflow-x-hidden">
<header class="sticky top-0 z-50 flex items-center justify-between px-4 py-3 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<button class="text-base font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition-colors">
            Cancelar
        </button>
<h1 class="text-lg font-bold">Agregar Producto</h1>
<button class="text-base font-bold text-primary hover:text-primary/80 transition-colors">
            Guardar
        </button>
</header>
<main class="flex-1 w-full max-w-md mx-auto p-4 space-y-6 pb-24">
<section class="flex justify-center">
<div class="relative group cursor-pointer w-40 h-40 rounded-xl bg-slate-100 dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-600 flex flex-col items-center justify-center transition-all hover:border-primary/50 dark:hover:border-primary/50">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-2xl">add_a_photo</span>
</div>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors">Tomar Foto</span>
</div>
</section>
<section class="space-y-4">
<h2 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider px-1">Detalles Básicos</h2>
<div class="bg-white dark:bg-[#192633] rounded-xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700/50">
<div class="border-b border-slate-100 dark:border-slate-700/50 px-4 py-3">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Nombre del Producto</label>
<input class="w-full bg-transparent border-none p-0 text-base placeholder:text-slate-400 focus:ring-0 focus:outline-none dark:text-white" placeholder="ej. Harina PAN 1kg" type="text"/>
</div>
<div class="border-b border-slate-100 dark:border-slate-700/50 px-4 py-3 flex items-center justify-between group cursor-pointer">
<div class="flex-1">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Categoría</label>
<select class="w-full bg-transparent border-none p-0 text-base text-slate-900 dark:text-white focus:ring-0 focus:outline-none appearance-none cursor-pointer">
<option disabled="" selected="" value="">Seleccionar categoría</option>
<option class="text-black" value="food">Alimentos y Bebidas</option>
<option class="text-black" value="cleaning">Limpieza</option>
<option class="text-black" value="electronics">Electrónica</option>
</select>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</div>
<div class="px-4 py-2 flex items-center justify-between gap-3">
<div class="flex-1 py-1">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Código de Barras</label>
<input class="w-full bg-transparent border-none p-0 text-base placeholder:text-slate-400 focus:ring-0 focus:outline-none dark:text-white font-mono" placeholder="Escanear o ingresar código" type="text"/>
</div>
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-primary hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
<span class="material-symbols-outlined">barcode_scanner</span>
</button>
</div>
</div>
</section>
<section class="space-y-4">
<div class="flex items-center justify-between px-1">
<h2 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Precios</h2>
<div class="flex items-center gap-1 text-xs text-primary bg-primary/10 px-2 py-1 rounded-full">
<span class="material-symbols-outlined text-[14px]">currency_exchange</span>
<span class="font-medium">BCV: 36.42 Bs/$</span>
</div>
</div>
<div class="bg-white dark:bg-[#192633] rounded-xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700/50">
<div class="border-b border-slate-100 dark:border-slate-700/50 px-4 py-3 flex gap-4">
<div class="flex-1">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Precio de Costo (USD)</label>
<div class="flex items-center">
<span class="text-slate-400 mr-1">$</span>
<input class="w-full bg-transparent border-none p-0 text-lg font-semibold placeholder:text-slate-400 focus:ring-0 focus:outline-none dark:text-white font-mono" placeholder="0.00" type="number"/>
</div>
</div>
<div class="flex-1 border-l border-slate-100 dark:border-slate-700/50 pl-4 opacity-60">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Costo en Bs.</label>
<div class="text-lg font-mono text-slate-600 dark:text-slate-300 pt-0.5">0.00</div>
</div>
</div>
<div class="px-4 py-3 bg-primary/5 dark:bg-primary/5">
<div class="flex gap-4">
<div class="flex-1">
<label class="block text-xs font-bold text-primary mb-1">Precio de Venta (USD)</label>
<div class="flex items-center">
<span class="text-primary/60 mr-1 text-xl">$</span>
<input class="w-full bg-transparent border-none p-0 text-2xl font-bold placeholder:text-primary/30 focus:ring-0 focus:outline-none text-primary font-mono" placeholder="0.00" type="number"/>
</div>
</div>
<div class="flex-1 border-l border-primary/10 pl-4">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Precio en Bs.</label>
<div class="text-2xl font-mono text-slate-900 dark:text-white pt-0.5 font-semibold">0.00</div>
</div>
</div>
<div class="mt-2 text-xs text-slate-500 dark:text-slate-400 flex justify-between">
<span>Margen de Ganancia: --%</span>
</div>
</div>
</div>
</section>
<section class="space-y-4">
<h2 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider px-1">Inventario</h2>
<div class="bg-white dark:bg-[#192633] rounded-xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700/50 flex divide-x divide-slate-100 dark:divide-slate-700/50">
<div class="flex-1 px-4 py-3">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Stock Inicial</label>
<input class="w-full bg-transparent border-none p-0 text-base placeholder:text-slate-400 focus:ring-0 focus:outline-none dark:text-white font-mono" placeholder="0" type="number"/>
</div>
<div class="flex-1 px-4 py-3">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Alerta Mín.</label>
<input class="w-full bg-transparent border-none p-0 text-base placeholder:text-slate-400 focus:ring-0 focus:outline-none dark:text-white font-mono" placeholder="5" type="number"/>
</div>
</div>
</section>
</main>
<div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark pt-8 z-40">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined">save</span>
            Guardar Producto
        </button>
</div>
<nav class="fixed bottom-0 left-0 right-0 hidden">
<div class="flex justify-around items-center bg-white dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 pb-safe pt-2">
<a class="flex flex-col items-center p-2 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-primary" href="#">
<span class="material-symbols-outlined mb-1">dashboard</span>
            Resumen
        </a>
<a class="flex flex-col items-center p-2 text-xs font-medium text-primary" href="#">
<span class="material-symbols-outlined mb-1">inventory_2</span>
            Inventario
        </a>
<a class="flex flex-col items-center p-2 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-primary" href="#">
<span class="material-symbols-outlined mb-1">point_of_sale</span>
            Ventas
        </a>
<a class="flex flex-col items-center p-2 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-primary" href="#">
<span class="material-symbols-outlined mb-1">bar_chart</span>
            Reportes
        </a>
<a class="flex flex-col items-center p-2 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-primary" href="#">
<span class="material-symbols-outlined mb-1">settings</span>
            Ajustes
        </a>
</div>
</nav>
</body></html>
