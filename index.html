<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CUADRA by JASA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ec4899">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9425/9425832.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- UI Core -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#ec4899',
                        secondary: '#2dd4bf',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-900 text-slate-900 font-sans h-full">

    <!-- The App Window -->
    <div id="app">

        <!-- View: Onboarding -->
        <main id="view-onboarding" class="view"></main>

        <!-- View: Dashboard -->
        <main id="view-dashboard" class="view"></main>

        <!-- View: Inventory -->
        <main id="view-inventory" class="view"></main>

        <!-- View: Sales -->
        <main id="view-sales" class="view"></main>

        <!-- View: Debts -->
        <main id="view-debts" class="view"></main>

        <!-- View: Settings -->
        <main id="view-settings" class="view"></main>

        <!-- View: Scanner -->
        <main id="view-scanner" class="view"></main>

    </div>

    <!-- Required Script -->
    <script src="js/app.js"></script>
    <script>
        // Register SW with cache purging logic
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                location.reload(); // Force update
                            }
                        };
                    };
                });
            });
        }
    </script>
</body>

</html>
